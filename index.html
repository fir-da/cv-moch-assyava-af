<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio - 3D Dual Mode</title>
    
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- 1. DEKLARASI TEMA (VARIABEL CSS) --- */
        
        /* TEMA TERANG (Elegan & Bersih) */
        :root {
            --bg-web: #f4f4f9;
            --bg-card: #ffffff;
            --text-title: #1a1a1a;
            --text-sub: #4a4a4a;
            --border-card: #e0e0e0;
            --btn-border: #c9a255; /* Aksen emas */
            --btn-text: #1a1a1a;
            --glow-effect: none;
            --shadow-card: 0 15px 35px rgba(0, 0, 0, 0.1);
            --img-glow: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
        }

        /* TEMA GELAP (Saber Mode - Futuristik & Menyala) */
        body.dark-mode {
            --bg-web: #050505;
            --bg-card: #121212;
            --text-title: #ffffff;
            --text-sub: #a0a0a0;
            --border-card: #333333;
            --btn-border: #00e5ff; /* Aksen Saber Cyan */
            --btn-text: #ffffff;
            --glow-effect: 0 0 15px rgba(0, 229, 255, 0.5), inset 0 0 8px rgba(0, 229, 255, 0.2);
            --shadow-card: 0 20px 40px rgba(0, 0, 0, 0.8);
            /* Drop shadow mengikuti bentuk tubuh PNG karakter dengan warna cyan */
            --img-glow: drop-shadow(0 0 15px rgba(0, 229, 255, 0.6));
        }

        /* --- 2. GAYA DASAR --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            background-color: var(--bg-web);
            transition: background-color 0.5s ease;
        }

        /* --- 3. TOMBOL GANTI TEMA --- */
        .theme-toggle {
            position: absolute;
            top: 30px;
            right: 30px;
            background: var(--bg-card);
            color: var(--text-title);
            border: 1px solid var(--border-card);
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: var(--shadow-card);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .theme-toggle:hover {
            box-shadow: var(--glow-effect);
            border-color: var(--btn-border);
            color: var(--btn-border);
        }

        /* --- 4. DESAIN KARTU & EFEK 3D --- */
        .carousel-container {
            position: relative;
            width: 100vw;
            max-width: 500px;
            height: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            position: absolute;
            width: 280px;
            height: 440px;
            background-color: var(--bg-card);
            border-radius: 16px; 
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            user-select: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.5s ease;
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card);
        }

        /* LOGIKA POSISI KARTU & AKTIVASI RUANG 3D */
        .card[data-pos="center"] { 
            /* Menambahkan perspective dan transform-style agar elemen di dalamnya bisa melayang 3D */
            transform: translateX(0) scale(1) perspective(1000px) rotateX(0) rotateY(0); 
            transform-style: preserve-3d;
            z-index: 3; 
            opacity: 1; 
            cursor: default; 
        }

        /* EFEK KARTU MIRING SAAT DISENTUH (HOVER) */
        .card[data-pos="center"]:hover {
            transform: translateX(0) scale(1) perspective(1000px) rotateX(15deg) rotateY(-10deg);
        }

        .card[data-pos="left"] { transform: translateX(-110px) scale(0.85); z-index: 1; opacity: 0.6; cursor: pointer; }
        .card[data-pos="right"] { transform: translateX(110px) scale(0.85); z-index: 1; opacity: 0.6; cursor: pointer; }
        .card:not([data-pos="center"]) a { pointer-events: none; }

        /* --- 5. STYLING KONTEN KARTU (KARAKTER POP-OUT) --- */
        .profile-img {
            width: 130px; /* Diperbesar agar pop-out lebih terasa */
            height: auto;
            max-height: 150px;
            object-fit: contain;
            margin-top: -10px;
            margin-bottom: 15px;
            /* Menggunakan drop-shadow alih-alih box-shadow agar cahaya mengikuti lekuk tubuh PNG */
            filter: var(--img-glow); 
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* KARAKTER MAJU & NAIK SAAT KARTU DISENTUH */
        .card[data-pos="center"]:hover .profile-img {
            /* Mendorong gambar 80px ke arah layar dan 20px ke atas menembus batas kartu */
            transform: translateZ(80px) translateY(-20px) scale(1.15);
        }

        .title { font-size: 1.25rem; color: var(--text-title); margin-bottom: 12px; font-weight: 800; }
        .subtitle { font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; margin-bottom: auto; }
        
        /* Membuat Teks Ikut Melayang 3D */
        .title, .subtitle {
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card[data-pos="center"]:hover .title { transform: translateZ(50px); }
        .card[data-pos="center"]:hover .subtitle { transform: translateZ(30px); }

        .links-container { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: auto; margin-bottom: auto; }

        /* --- 6. TOMBOL / DOCK --- */
        .btn-link {
            display: block;
            text-decoration: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            font-size: 0.95rem;
            color: var(--btn-text);
            background: transparent;
            border: 1px solid var(--border-card);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-link i { margin-right: 8px; font-size: 1.1em; vertical-align: middle; }

        .btn-link:hover {
            border-color: var(--btn-border);
            color: var(--btn-border);
            box-shadow: var(--glow-effect); 
            transform: translateY(-3px); 
        }

    </style>
</head>
<body>

    <button class="theme-toggle" id="themeBtn" title="Ganti Tema">
        <i class="fas fa-moon"></i>
    </button>

    <div class="carousel-container" id="cardCarousel">
        
        <!-- KARTU 1: Perkenalan -->
        <div class="card" data-pos="center">
            <!-- PENTING: Ganti nama file ini dengan foto Anda yang BACKGROUND-NYA SUDAH DIHAPUS (PNG Transparan) -->
            <img src="karakter-transparan.png" alt="Foto Profil" class="profile-img">
            <h2 class="title">Halo, saya Assyava! 👋</h2>
            <p class="subtitle">🎓 Lulusan Manajemen | 📈 Pecinta Saham | ⚙️ Pengulik Teknologi. Suka ngotak-ngatik barang dan selalu antusias belajar hal baru tiap harinya!</p>
        </div>

        <!-- KARTU 2: Sosmed -->
        <div class="card" data-pos="right">
            <h2 class="title" style="margin-top: 10px;">Mari berteman!</h2>
            <div class="links-container">
                <a href="#" class="btn-link"><i class="fab fa-instagram"></i> Instagram</a>
                <a href="#" class="btn-link"><i class="fab fa-facebook"></i> Facebook</a>
                <a href="#" class="btn-link"><i class="fas fa-globe"></i> Web CV Saya</a>
            </div>
        </div>

        <!-- KARTU 3: Kontak -->
        <div class="card" data-pos="left">
            <h2 class="title" style="margin-top: 10px; font-size: 1.1rem;">Ngobrol proyek & kerjaan?</h2>
            <div class="links-container">
                <a href="#" class="btn-link"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a href="#" class="btn-link"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="#" class="btn-link"><i class="fas fa-envelope"></i> Email</a>
            </div>
        </div>

    </div>

    <script>
        const cards = Array.from(document.querySelectorAll('.card'));
        let positions = ['center', 'right', 'left'];

        function updateCards() {
            cards.forEach((card, index) => {
                card.setAttribute('data-pos', positions[index]);
            });
        }

        cards.forEach((card, index) => {
            card.addEventListener('click', () => {
                const currentPos = card.getAttribute('data-pos');
                if (currentPos === 'center') return;
                
                if (currentPos === 'right') {
                    positions.unshift(positions.pop());
                } else if (currentPos === 'left') {
                    positions.push(positions.shift());
                }
                updateCards();
            });
        });

        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = themeBtn.querySelector('i');

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        });
    </script>

</body>
</html>
